name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: SashaExplorer version
      description: Settings → Updates shows it.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots or details. Check them for folder names you would rather not share.
